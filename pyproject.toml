[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-verify"
version = "0.2.0"
description = "Map markdown acceptance items to explicit implementation evidence for advisory spec-drift checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Rolando Bosch"},
]
keywords = ["spec drift", "repo intent verification", "handoff verification", "acceptance criteria", "ci lint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
intent-verify = "intent_verify.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/hermes-labs-ai/intent-verify"
Documentation = "https://github.com/hermes-labs-ai/intent-verify#readme"
Repository = "https://github.com/hermes-labs-ai/intent-verify"
Issues = "https://github.com/hermes-labs-ai/intent-verify/issues"
Changelog = "https://github.com/hermes-labs-ai/intent-verify/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
